[project]
name = "knowledge-store"
version = "0.1.0"
description = "Knowledge Store — second brain lưu khái niệm học sinh đã học (hệ sinh thái Chiron)."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "flask>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ks = "ks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ks"]

[tool.pytest.ini_options]
testpaths = ["tests"]

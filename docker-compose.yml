# Chiron — the whole ecosystem in one command:
#
#   cp .env.example .env            # set POSTGRES_PASSWORD
#   docker compose up --build -d
#   docker compose exec mnemosyne backend create-user <email>
#   → open http://localhost:4173 and paste the token into Settings
#
# Each module's secrets stay in that module's .env (mnemosyne/.env,
# knowledge-store/.env, frontend/.env) and only reach the containers through env_file
# at run time — they are never baked into an image.
#
# Every NETWORK variable is set again under `environment:`, because it wins over env_file.
# The existing .env files describe running outside Docker (127.0.0.1, port 8082 to avoid
# SearXNG); under Compose the services call each other by service name.

name: chiron

x-db-url: &db-password ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env (see .env.example)}

services:
  postgres:
    # Same major version as the Postgres cluster used outside Docker (18.x). The official
    # image ships pg_trgm (KS concept de-duplication) and pgcrypto (Mnemosyne).
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: *db-password
    volumes:
      # Postgres 18+ keeps its data under /var/lib/postgresql/<major>/docker —
      # mount the parent directory so a future major upgrade needs no volume change.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No port published to the host. To psql from the host for debugging, uncomment —
    # port 5433 so it does not clash with the old Postgres cluster on 5432.
    # ports:
    #   - "127.0.0.1:5433:5432"

  knowledge-store:
    build: ./knowledge-store
    restart: unless-stopped
    env_file:
      - path: ./knowledge-store/.env
        required: false
    environment:
      KS_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/chiron_ks
      KS_TEST_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/chiron_ks_test
      KS_HTTP_HOST: 0.0.0.0
      KS_HTTP_PORT: "8080"
      KS_MNEMOSYNE_URL: http://mnemosyne:8081
      KS_OCR_URL: http://ocr:8866
    depends_on:
      postgres:
        condition: service_healthy
      # OCR is not in depends_on: without OCR only note scanning breaks
      # (the /notes routes return a clear error); KS still serves everything else.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No port published to the host: only the frontend proxy and Mnemosyne call KS,
    # both over the internal network. That also ends the port 8080 clash with SearXNG.

  ocr:
    # PaddleOCR (CPU, English) for the Note scan screen. Models are baked into
    # the image, so the container starts with no network access.
    #
    # A prebuilt image on GHCR (public). With both `image:` and `build:`, Compose
    # tries to PULL first and only builds when the registry lacks this tag — so other
    # machines need not build PaddlePaddle (~2.5 GB), nor the dev machine's
    # network setup. After changing code in ocr/, rebuild and push a new tag (see
    # ocr/README.md), then bump the tag here.
    image: ghcr.io/qinzinn/chiron-ocr:0.2.0
    build:
      context: ./ocr
      # Only used when building from source. network: host because on the dev machine,
      # downloading large files from inside Docker's bridge network hangs forever (measured:
      # 2.5 s via host, never finishes via bridge).
      network: host
    restart: unless-stopped
    healthcheck:
      # "ready", not merely "port open": loading the models takes tens of seconds,
      # and /ocr returns 503 meanwhile.
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8866/health', timeout=3))['ready']"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    # No port published to the host: only the Knowledge Store calls OCR, over the internal network.

  mnemosyne:
    build: ./mnemosyne
    restart: unless-stopped
    env_file:
      - path: ./mnemosyne/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/mnemosyne
      MNEMOSYNE_BIND: 0.0.0.0:8081
      KS_HTTP_URL: http://knowledge-store:8080
    depends_on:
      postgres:
        condition: service_healthy
      # KS is not in depends_on, deliberately: Mnemosyne treats KS as optional
      # (without KS only transcript syncing is lost), so a dead KS must not
      # keep Mnemosyne from starting.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      # The browser calls Mnemosyne DIRECTLY (with CORS), so this port must reach the host —
      # but only on loopback, matching the "local dev" scope CORS assumes.
      - "127.0.0.1:8081:8081"

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      CHIRON_BIND_HOST: 0.0.0.0
      # The proxy (inside the container) calls KS over the internal network.
      CHIRON_KS_URL: http://knowledge-store:8080
      # The address the BROWSER uses to call Mnemosyne — i.e. the port published above,
      # not the service name (the browser is not on the Compose network).
      CHIRON_MNEMOSYNE_URL: http://127.0.0.1:8081
    ports:
      - "127.0.0.1:4173:4173"
    # No depends_on on any backend: the interface is designed to run while a
    # module is down and to report the error for that area only.

volumes:
  pgdata:
